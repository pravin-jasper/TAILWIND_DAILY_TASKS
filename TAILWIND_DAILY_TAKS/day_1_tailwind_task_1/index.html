<html>
<head>
<title>form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
	<body class="bg-cyan-200">
		<form>
	
			<h1 class="text-6xl font-bold text-center"> Application Form</h1>
            <br>
            <div class="mx-30">
<input type="text"  name="fname" placeholder="Enter your First Name" class="text-3xl"><br><br>
<input type="text"  name="lname" placeholder="Enter your Last Name" class="text-3xl"><br><br>
<input type="number" name="phone" placeholder="Enter your Phone Number" class="text-3xl"><br><br>
<input type="email"  name="emailid" placeholder="Enter your Email Id" class="text-3xl"><br><br>
<input type="file"  name="upload" placeholder="Enter your File Upload" class="text-3xl"><br><br>
<input type="date"  name="date" placeholder="Enter your Date" class="text-3xl"><br><br>
<input type="time"  name="time" placeholder="Enter your Time" class="text-3xl"><br><br>
<div class="flex justify-center">
<button class="p-5 border-1 bg-red-500 rounded-lg text-3xl">submit</button>


</div>
</form>
	</body>
	</html>
