<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndusInd Bank Credit Card Payment</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 py-10 px-4">

  <div class="mx-auto max-w-2xl rounded-2xl bg-white p-6 shadow-lg sm:p-8">

    <!-- Header -->
    <h1 class="text-2xl font-bold text-gray-800">
      Step 1: Provide IndusInd Bank Credit Card Details
    </h1>

    <p class="mt-2 text-gray-600"> Please enter your IndusInd Bank credit card number and payment amount.  </p>

    <form class="mt-8 space-y-6">

      <!-- Card Type -->
      <div>
        <label class="mb-3 block text-sm font-semibold text-gray-700">  Select Card Type  </label>

        <div class="flex items-center gap-6">

          <label class="flex cursor-pointer items-center gap-2">
            <input type="radio" name="vcard"   value="visa"  class="h-4 w-4 text-blue-600 focus:ring-blue-500">

            <img src="https://images.hindustantimes.com/tech/img/2020/11/05/1600x900/image_-_2020-11-05T095740.083_1604550459365_1604550465218_1604550598928.jpg" class="h-8 w-12 rounded object-contain" alt="Visa" >
          </label>

          <label class="flex cursor-pointer items-center gap-2">
            <input type="radio" name="vcard"  value="rupay" class="h-4 w-4 text-blue-600 focus:ring-blue-500">

            <img src="https://tse3.mm.bing.net/th/id/OIP.jOUW5N630RdeYpEB-cnPGQHaC0?r=0&w=2000&h=760&rs=1&pid=ImgDetMain&o=7&rm=3" class="h-8 w-12 rounded object-contain" alt="RuPay">
          </label>

          <label class="flex cursor-pointer items-center gap-2">
            <input type="radio"  name="vcard"  value="mastercard" class="h-4 w-4 text-blue-600 focus:ring-blue-500">

            <img src="https://pluspng.com/img-png/mastercard-new-logo-png-link-to-logo-mastercard-large-999.png" class="h-8 w-12 rounded object-contain"  alt="Mastercard"   >
          </label>

        </div>
      </div>

      <!-- Card Number -->
      <div>
        <label  for="cardno"  class="mb-2 block text-sm font-semibold text-gray-700" > IndusInd Bank Credit Card No. </label>

        <input type="text" id="cardno"   name="cardno"   placeholder="Enter credit card number" class="w-full rounded-lg border border-gray-300 px-4 py-3  outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
      </div>

      <!-- Re-enter Card Number -->
      <div>
        <label for="reenter" class="mb-2 block text-sm font-semibold text-gray-700">  Re-enter IndusInd Bank Credit Card No. </label>

        <input
          type="text" id="reenter" name="reenter" placeholder="Re-enter credit card number" class="w-full rounded-lg border border-gray-300 px-4 py-3  outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200" >
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="mb-2 block text-sm font-semibold text-gray-700">  E-mail ID   </label>

        <input type="email"  id="email"  name="email" placeholder="example@email.com" class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200" >
      </div>

      <!-- Mobile -->
      <div>
        <label  for="phone" class="mb-2 block text-sm font-semibold text-gray-700">  Mobile No.  </label>

        <input type="tel" id="phone" name="phone" placeholder="Enter mobile number" class="w-full rounded-lg border border-gray-300 px-4 py-3  outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
      </div>

      <!-- Payment Amount -->
      <div>
        <label for="payment"  class="mb-2 block text-sm font-semibold text-gray-700"> Payment Amount (Rs.) </label>

        <input type="number" id="payment" name="payment" placeholder="Enter payment amount"  class="w-full rounded-lg border border-gray-300 px-4 py-3 transition  focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
      </div>

      <!-- Bank Account -->
      <div>
        <h3 class="text-lg font-semibold text-gray-800"> Choose your Bank Account  </h3>

        <p class="mt-1 text-sm text-gray-500">  Select your bank account below and click on "Submit".  </p>

        <label for="bank"  class="mb-2 mt-4 block text-sm font-semibold text-gray-700" > Select Bank Account </label>

        <select id="bank" name="bank" class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-3 focus:ring-blue-200">          <option value="">Select a bank</option>
          <option value="sbi">SBI Bank</option>
          <option value="tmb">TMB Bank</option>
          <option value="iob">IOB Bank</option>
          <option value="canara">Canara Bank</option>
        </select>
      </div>

      <!-- Submit -->
      <button type="submit" class="w-full rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white shadow transition hover:bg-blue-700"> Submit </button>

    </form>
  </div>

</body>
</html>
